[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fendlera"
version = "0.0.1"
description = "A headless harness for building capable offline agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Joboy" }]
keywords = ["agent", "llm", "local-first", "offline", "ollama"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/antoniojoboy/fendlera"

# Without these two blocks hatchling ships poc/ inside the published tarball.
# The POCs are throwaway and must never leave this repo.
[tool.hatch.build.targets.wheel]
packages = ["src/fendlera"]

[tool.hatch.build.targets.sdist]
include = ["src/fendlera", "README.md", "LICENSE", "pyproject.toml"]
