name: pooh_held
description: Owner-written statements (Piglet's blustery day), questions rebuilt 28 Sep 2026.
statements:
- text: d-d-dear me, it's Piglet speaking, on a very blustery Thursday morning in the Hundred Acre Wood
  speaker: owner
  phase: early
- text: I was trying to sweep oak leaves outside my house when a big gust of wind blew my red woolen scarf
    all the way over to the Hundred Acre Meadow
  speaker: owner
  phase: early
- text: Pooh came along eating a pot of crisp crunchy acorns—no wait, silly bear, he was eating golden
    honey straight from an earthenware crock
  speaker: owner
  phase: early
- text: we went to look for my scarf near Owl's house, but Owl's treetop home had blown right over onto
    the wet grass
  speaker: owner
  phase: early
- text: Eeyore was building a new house out of birch sticks at Pooh Corner, though it keeps falling down
    whenever someone sneezes
  speaker: owner
  phase: early
- text: Kanga gave us warm goat milk with ginger for tea time at four o'clock to keep us cold-free
  speaker: owner
  phase: early
- text: Tigger doesn't eat honey or haycorns, he tried them both and said they are nasty things, he only
    eats extract of malt from a glass jar
  speaker: owner
  phase: early
- text: if it stops raining by five o'clock, Christopher Robin promised to lead an expedition to find
    the North Pole
  speaker: owner
  phase: early
- text: Rabbit was busy in his garden planting twenty-four orange carrots, but a family of field mice
    ate twelve of them before noon
  speaker: owner
  phase: early
- text: Christopher Robin lost his rubber gumboots near the Stream, so he had to wear brown leather shoes
    instead
  speaker: owner
  phase: early
- text: Roo was wearing a bright yellow raincoat that Kanga made out of an old tablecloth
  speaker: owner
  phase: early
- text: Owl tried to write a poem about the storm on a piece of birch bark, but his quill broke
  speaker: owner
  phase: early
- text: Pooh found my red woolen scarf stuck on top of a tall gorse bush near the Posing Bear Tree
  speaker: owner
  phase: early
- text: we saw a strange footprint in the mud near the Pinehead Stand, but Eeyore said it was just his
    own hoofmark from this morning
  speaker: owner
  phase: early
- text: Rabbit caught six caterpillars on his cabbage leaves and put them in a tin box
  speaker: owner
  phase: early
