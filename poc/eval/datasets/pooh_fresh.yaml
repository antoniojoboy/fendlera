name: pooh_fresh
description: Owner-written statements (Rabbit's party), questions rebuilt 28 Sep 2026.
statements:
- text: right then, Rabbit here, organizing the grand Hundred Acre Autumn Party, and everything must go
    strictly according to schedule
  speaker: owner
  phase: early
- text: the party is set for my burrow near the Cabbage Patch
  speaker: owner
  phase: early
- text: I used to bake dandelion pie for these events, but I burnt it twice in 1926 and I refuse to ever
    make it again
  speaker: owner
  phase: early
- text: Pooh insists we should serve sweet honeycakes, I think it's a terrible sticky idea, but everyone
    else voted for it so fine
  speaker: owner
  phase: early
- text: oh how I love when Tigger bounces uninvited into my garden, said absolutely nobody ever, he knocked
    over six of my best pumpkin vines
  speaker: owner
  phase: early
- text: Eeyore is supposed to collect thistles on morning duty if it doesn't fog up
  speaker: owner
  phase: early
- text: Christopher Robin is bringing three linen tablecloths from his house at the Top of the Forest
  speaker: owner
  phase: early
- text: my cousin Late-in-Life, who is a small grey beetle, is in charge of music
  speaker: owner
  phase: early
- text: reckon we will set up six wooden picnic tables if we can get volunteers under three hours
  speaker: owner
  phase: early
- text: Gopher is digging a grand tunnel straight to the party table, pick up time for the apple cider
    is 2:30
  speaker: owner
  phase: early
- text: blasphemy, what a mess, the stream flooded the lower path and everyone got their paws completely
    soaked
  speaker: owner
  phase: early
- text: I cannot stand eating caterpillars, found that out during the big spring picnic
  speaker: owner
  phase: early
- text: my friend Roo is the one with the blue toy sailing boat, I just let him sail it in my wooden bucket
  speaker: owner
  phase: early
- text: actually scratch what I said earlier about Friday, the party is shifted to Saturday now because
    of the heavy rain
  speaker: owner
  phase: early
- text: Kanga's relative, her uncle who lives over in the Far Woods, is a renowned baker
  speaker: owner
  phase: early
- text: Owl volunteered to read an eighty-page speech on forest history, but I told him he has a five-minute
    limit
  speaker: owner
  phase: early
- text: Piglet is bringing ten pink paper lanterns to string between the oak branches
  speaker: owner
  phase: early
- text: hoo-hoo-hoo-hoo! Tigger here, I tried to bounce over Christopher Robin's gate and landed straight
    in a patch of wild clover
  speaker: owner
  phase: early
- text: Eeyore's birthday party was held at the 100 Aker Wood signpost, and we had a cake with three white
    candles
  speaker: owner
  phase: early
- text: Owl wrote 'HIPY PAPY OTH BTHUTH' on Eeyore's card using black ink
  speaker: owner
  phase: early
