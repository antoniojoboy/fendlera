name: pooh_main
description: Owner-written statements (Pooh's honey expedition), questions rebuilt 28 Sep 2026.
statements:
- text: oh rum-tum-tiddle-um-tum, it is me Winnie the Pooh, though most of my friends in the Hundred Acre
    Wood just call me Pooh or Pooh Bear, anyway
  speaker: owner
  phase: early
- text: so this morning my tummy was doing a rumble-tumble, so I went to visit Piglet at his house in
    the Beech Tree, which is right in the middle of the forest
  speaker: owner
  phase: early
- text: Piglet offered me some haycorns, but oh dear, a bear of very little brain doesn't eat haycorns,
    I only wanted sweet golden honey
  speaker: owner
  phase: early
- text: we went to see Owl at the Chestnuts to borrow a tall ladder, but Owl kept talking about his Uncle
    Robert for twenty minutes, so we left without it
  speaker: owner
  phase: early
- text: Rabbit said there was a massive honeycomb up in the Great Oak, but wait, no, sorry, he remembered
    wrong—it was actually at the Sandy Pit near Kanga's place
  speaker: owner
  phase: early
- text: Eeyore was sitting by the Thistle Patch looking sad because he lost his tail again, so Piglet
    gave him a pink ribbon to cheer him up
  speaker: owner
  phase: early
- text: Tigger bounced by and said he wanted to help us reach the honeycomb, claiming Tiggers love climbing
    high trees more than anything else
  speaker: owner
  phase: early
- text: well, turns out Tiggers don't like climbing down trees at all, so he got stuck on a branch for
    three whole hours until Roo found him
  speaker: owner
  phase: early
- text: I thought about floating up with a balloon, a blue one to look like the sky, but I don't have
    any blue ones left—only a small red one
  speaker: owner
  phase: early
- text: for lunch Christopher Robin made everyone a picnic at the Six Pine Trees, and we had buttered
    condensed milk on bread, which is my second favorite food
  speaker: owner
  phase: early
- text: by the afternoon we finally found a honeypot hidden inside a hollow log near the Floating Ford,
    and it had four large jars inside
  speaker: owner
  phase: early
- text: I was going to save two jars for winter, but oh bother, I accidentally ate three jars right there
    on the spot
  speaker: owner
  phase: early
- text: if the Heffalump comes by tonight, I'll hide my last jar under the armchair, don't tell him where
    it is
  speaker: owner
  phase: early
- text: Eeyore doesn't drink tea by the way, he only drinks muddy marsh water from the damp ditch
  speaker: owner
  phase: early
- text: Christopher Robin brought his silver whistle to call us for dinner at five o'clock sharp
  speaker: owner
  phase: early
- text: my red balloon actually popped when it hit a gorse bush near the gravel pit
  speaker: owner
  phase: early
- text: Piglet tried to carry one of the honey jars, but it weighed ten pounds and he dropped it on a
    mossy stone
  speaker: owner
  phase: early
- text: Kanga sent a basket with twelve fresh apples, but Tigger accidentally bounced into it and squashed
    eight of them
  speaker: owner
  phase: early
- text: Owl claims his grandfather lived to be ninety-four years old, but Eeyore says that's complete
    nonsense
  speaker: owner
  phase: early
- text: Christopher Robin wrote a note with a purple crayon saying 'GON OUT BACKSON', which Rabbit misread
    as a dangerous monster
  speaker: owner
  phase: early
